<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Hexagon / Shield -->
  <rect width="64" height="64" rx="16" fill="#0B0F19" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#g1)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Agent Core Kernel Symbol -->
  <circle cx="32" cy="32" r="10" stroke="url(#g1)" stroke-width="2.5" fill="#0F172A" filter="url(#glow)" />
  <circle cx="32" cy="32" r="4" fill="#06B6D4" />
  
  <!-- Orbital Nodes (Federation) -->
  <line x1="32" y1="12" x2="32" y2="22" stroke="url(#g1)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="32" y1="42" x2="32" y2="52" stroke="url(#g1)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="12" y1="32" x2="22" y2="32" stroke="url(#g1)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="42" y1="32" x2="52" y2="32" stroke="url(#g1)" stroke-width="2" stroke-dasharray="2 2" />

  <circle cx="32" cy="12" r="3" fill="#06B6D4" />
  <circle cx="32" cy="52" r="3" fill="#8B5CF6" />
  <circle cx="12" cy="32" r="3" fill="#3B82F6" />
  <circle cx="52" cy="32" r="3" fill="#06B6D4" />
</svg>
