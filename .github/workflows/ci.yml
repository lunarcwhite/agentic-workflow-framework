name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install Ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Run Ruff Linter
      run: |
        ruff check tools/ tests/ --statistics

  test:
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install UAF in editable mode
      run: |
        pip install -e .

    - name: Verify CLI entrypoint
      run: |
        uaf --help

    - name: Run v3.0.1 Conformance & Archetype Validation
      run: |
        python tests/test_v301_field.py

    - name: Run v3.0.0 Field & Downgrade Validation
      run: |
        python tests/test_v30_field.py

    - name: Run v3.1.0 Team Orchestrator Validation
      run: |
        python tests/test_v31_team.py

    - name: Run v3.2.0 Plugin Marketplace & Domain Specialist Validation
      run: |
        python tests/test_v32_plugin.py

