id: TASK-0001
type: FEATURE
status: COMPLETED
scope:
  level: FEATURE
  domains:
  - BACKEND
  risk: LOW
intent:
  statement: Allow callers to safely request task completion more than once without
    changing the result or introducing an error.
  confidence: HIGH
  source: user
requirements:
- id: REQ-001
  priority: MUST
  statement: complete_task marks an incomplete task as completed.
- id: REQ-002
  priority: MUST
  statement: Calling complete_task on an already completed task leaves it completed
    and does not create a new state transition.
constraints:
- id: CON-001
  statement: Keep the change dependency-free.
- id: CON-002
  statement: Reuse the existing Task model.
non_goals:
- Persistence redesign.
- API redesign.
acceptance_criteria:
- id: AC-001
  given: an incomplete task
  when: complete_task is called
  then: completed becomes true
- id: AC-002
  given: a completed task
  when: complete_task is called
  then: the task remains completed
verification:
- method: python -m pytest test_src.py
  evidence: EVD-0001
expected_changes:
  files:
  - src.py
  - test_src.py
  modules:
  - task-service
change_budget:
  mode: strict
  statement: Only the task completion implementation and directly related tests.
context: []
decisions:
- DEC-0001
memory_candidates:
- MEM-0001
related: []
