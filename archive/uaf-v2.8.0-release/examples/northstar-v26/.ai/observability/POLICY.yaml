schema_version: '1.5'
enabled: true
budgets:
  max_average_context_tokens: 12000
  max_declared_unused_rate: 0.40
  max_repeated_path_rate: 0.35
  max_memory_stale_rate: 0.25
  min_memory_reuse_rate: 0.25
  max_replans_per_task: 2.0
retention:
  events_days: 90
privacy:
  store_content: false
  store_prompt: false
  store_secret_values: false
