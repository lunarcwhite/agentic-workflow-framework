[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agent-framework"
version = "3.0.1"
description = "Universal AI Agent Framework (UAAF) Reference Distribution and CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "lunarcwhite", email = "rizkym058@mail.com" }
]
keywords = [
    "ai",
    "agent",
    "framework",
    "governance",
    "anti-slop",
    "verification",
    "federation",
    "llm",
    "coding-agent"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "PyYAML>=6.0.1",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
keychain = [
    "keyring>=24.0.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
uaf = "tools.uaf:main"

[project.urls]
Homepage = "https://github.com/lunarcwhite/universal-agent-framework"
Repository = "https://github.com/lunarcwhite/universal-agent-framework.git"
Issues = "https://github.com/lunarcwhite/universal-agent-framework/issues"
Changelog = "https://github.com/lunarcwhite/universal-agent-framework/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
